<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <defs>
        <linearGradient id="chefSkin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffdfc4" />
            <stop offset="100%" stop-color="#f0bba1" />
        </linearGradient>
        <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f5efe9" />
        </linearGradient>
        <!-- subtle shadow -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.05"/>
        </filter>
    </defs>
    <!-- Background Circle -->
    <circle cx="60" cy="60" r="56" fill="#fdfbf9" stroke="#eadfcb" stroke-width="2"/>
    
    <!-- Shoulders / Coat -->
    <path d="M 30,110 C 30,85 90,85 90,110 Z" fill="#ffffff" stroke="#eadfcb" stroke-width="2"/>
    <path d="M 60,87 L 60,110" stroke="#eadfcb" stroke-width="2"/>
    
    <!-- Scarf -->
    <path d="M 45,86 Q 60,105 75,86 L 60,80 Z" fill="#160b04"/>
    <path d="M 60,90 Q 55,102 48,105 Q 60,105 60,90" fill="#160b04"/>

    <!-- Head / Face -->
    <rect x="40" y="45" width="40" height="42" rx="20" fill="url(#chefSkin)" />
    
    <!-- Ears -->
    <circle cx="38" cy="65" r="4.5" fill="#f0bba1" />
    <circle cx="82" cy="65" r="4.5" fill="#f0bba1" />

    <!-- Eyes (happy closed curves) -->
    <path d="M 48,60 Q 52,56 56,60" fill="none" stroke="#5a4030" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 64,60 Q 68,56 72,60" fill="none" stroke="#5a4030" stroke-width="2.5" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="48" cy="66" r="3" fill="#e88175" opacity="0.3"/>
    <circle cx="72" cy="66" r="3" fill="#e88175" opacity="0.3"/>

    <!-- Nose -->
    <path d="M 60,65 C 64,65 64,69 60,70" fill="none" stroke="#d59a7e" stroke-width="2" stroke-linecap="round"/>

    <!-- Moustache (fancy curly) -->
    <path d="M 46,75 Q 52,70 60,74 Q 68,70 74,75 C 78,78 72,82 66,78 Q 60,75 54,78 C 48,82 42,78 46,75 Z" fill="#5a4030"/>

    <!-- Chef Hat -->
    <!-- Base -->
    <rect x="35" y="38" width="50" height="12" rx="4" fill="#ffffff" filter="url(#shadow)" />
    <!-- Poofs -->
    <path d="M 32,38 C 25,25 35,10 48,15 C 55,0 75,5 78,20 C 90,15 95,30 88,40 Z" fill="url(#hatGrad)" filter="url(#shadow)" />
</svg>
