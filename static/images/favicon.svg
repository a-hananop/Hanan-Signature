    <!-- plate -->
    <path d="M13.5 41.5h37c-.9 4.7-7.1 7.4-18.5 7.4s-17.6-2.7-18.5-7.4Z" fill="#9d610b" stroke="#f6d582" stroke-width="1"/>
    <path d="M18 43.2h28" stroke="#fff0ad" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <text x="32" y="57" text-anchor="middle" fill="#fff0ad" font-family="Georgia,serif" font-size="4.8" font-weight="700" letter-spacing="1.4">HANAN</text>
