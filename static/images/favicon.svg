<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="velvet" cx="35%" cy="20%" r="90%">
      <stop offset="0" stop-color="#4b2815"/>
      <stop offset=".62" stop-color="#211007"/>
      <stop offset="1" stop-color="#0e0704"/>
    </radialGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ad"/>
      <stop offset=".38" stop-color="#eab85c"/>
      <stop offset="1" stop-color="#a96708"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#velvet)" stroke="#d79a2b" stroke-width="2"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#f6d582" stroke-opacity=".42" stroke-width=".8"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#a96708" stroke-opacity=".5" stroke-width="1"/>
  <path d="M32 7.5v2M32 54.5v2M7.5 32h2M54.5 32h2" stroke="#f6d582" stroke-opacity=".6" stroke-width="1"/>
  <g filter="url(#glow)">
    <!-- solid handle -->
    <rect x="28.5" y="11" width="7" height="5.5" rx="2.75" fill="url(#champagne)"/>
    <circle cx="32" cy="11" r="2.2" fill="#f6d582"/>
    <!-- filled cloche body for clear recognition at small sizes -->
    <path d="M17 38.5c0-1.2.9-2.2 2.1-2.2h25.8c1.2 0 2.1 1 2.1 2.2H17Z" fill="url(#champagne)"/>
